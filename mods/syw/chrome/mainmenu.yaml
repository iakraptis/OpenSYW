# Copy of common|chrome/mainmenu.yaml (release-20250330) with the SYW title screen added.
Container@MAINMENU:
	Logic: MainMenuLogic
	Children:
		LogicKeyListener@GLOBAL_KEYHANDLER:
			Logic: MusicHotkeyLogic, ScreenshotHotkeyLogic, MuteHotkeyLogic
				StopMusicKey: StopMusic
				PauseMusicKey: PauseMusic
				PrevMusicKey: PrevMusic
				NextMusicKey: NextMusic
				TakeScreenshotKey: TakeScreenshot
				MuteAudioKey: ToggleMute
		# Original SYW title screen, stretched to the window: covers the shellmap, drawn under the menus.
		StretchedImage@TITLE_SCREEN:
			Width: WINDOW_WIDTH
			Height: WINDOW_HEIGHT
			ImageCollection: title-screen
			ImageName: title
		# Original fire loop (ani.anm, SYWtoORA/tools/menu_fire_export.py) rising over the bottom of the title screen.
		AnimatedImage@MENU_FIRE:
			Width: WINDOW_WIDTH
			Height: WINDOW_HEIGHT
			ImageCollections: menu-fire-0, menu-fire-1, menu-fire-2
			Frames: 56
			FrameTime: 60
			SourceSize: 640, 480
		# No Background@BORDER: the stock frame drew a border around the title screen.
		# No Image@LOGO: the title screen already carries the game logo in that corner. No version label either: it
		# only showed the SDK placeholder "{DEV_VERSION}".
		Container@MENUS:
			X: 13 + (WINDOW_WIDTH - 522) / 4 - WIDTH / 2
			Y: WINDOW_HEIGHT / 2 - HEIGHT / 2
			Width: 200
			Height: 320
			Children:
				Background@MAIN_MENU:
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT
					Children:
						Label@MAINMENU_LABEL_TITLE:
							X: 0
							Y: 22
							Width: 200
							Height: 30
							Text: label-mainmenu-title
							Align: Center
							Font: Bold
						Button@SINGLEPLAYER_BUTTON:
							X: PARENT_WIDTH / 2 - WIDTH / 2
							Y: 60
							Width: 140
							Height: 30
							Text: label-singleplayer-title
							Font: Bold
						Button@MULTIPLAYER_BUTTON:
							X: PARENT_WIDTH / 2 - WIDTH / 2
							Y: 100
							Width: 140
							Height: 30
							Text: label-multiplayer-title
							Font: Bold
						Button@SETTINGS_BUTTON:
							X: PARENT_WIDTH / 2 - WIDTH / 2
							Y: 140
							Width: 140
							Height: 30
							Text: button-settings-title
							Font: Bold
						Button@EXTRAS_BUTTON:
							X: PARENT_WIDTH / 2 - WIDTH / 2
							Y: 180
							Width: 140
							Height: 30
							Text: button-extras-title
							Font: Bold
						Button@CONTENT_BUTTON:
							X: PARENT_WIDTH / 2 - WIDTH / 2
							Y: 220
							Width: 140
							Height: 30
							Text: button-main-menu-content
							Font: Bold
						Button@QUIT_BUTTON:
							X: PARENT_WIDTH / 2 - WIDTH / 2
							Y: 260
							Width: 140
							Height: 30
							Text: button-quit
							Font: Bold
				Background@SINGLEPLAYER_MENU:
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT
					Children:
						Label@SINGLEPLAYER_MENU_TITLE:
							X: 0
							Y: 20
							Width: 200
							Height: 30
							Text: label-singleplayer-title
							Align: Center
							Font: Bold
						Button@SKIRMISH_BUTTON:
							X: PARENT_WIDTH / 2 - WIDTH / 2
							Y: 60
							Width: 140
							Height: 30
							Text: button-singleplayer-menu-skirmish
							Font: Bold
						Button@MISSIONS_BUTTON:
							X: PARENT_WIDTH / 2 - WIDTH / 2
							Y: 100
							Width: 140
							Height: 30
							Text: label-missions-title
							Font: Bold
						Button@LOAD_BUTTON:
							X: PARENT_WIDTH / 2 - WIDTH / 2
							Y: 140
							Width: 140
							Height: 30
							Text: button-singleplayer-menu-load
							Font: Bold
						Button@BACK_BUTTON:
							X: PARENT_WIDTH / 2 - WIDTH / 2
							Key: escape
							Y: 260
							Width: 140
							Height: 30
							Text: button-back
							Font: Bold
				Background@EXTRAS_MENU:
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT
					Children:
						Label@EXTRAS_MENU_TITLE:
							X: 0
							Y: 20
							Width: 200
							Height: 30
							Text: button-extras-title
							Align: Center
							Font: Bold
						Button@REPLAYS_BUTTON:
							X: PARENT_WIDTH / 2 - WIDTH / 2
							Y: 60
							Width: 140
							Height: 30
