							Y: 140
							Width: 140
							Height: 30
							Text: label-map-editor-title
							Font: Bold
						Button@ASSETBROWSER_BUTTON:
							X: PARENT_WIDTH / 2 - WIDTH / 2
							Y: 180
							Width: 140
							Height: 30
							Text: button-extras-menu-assetbrowser
							Font: Bold
						Button@CREDITS_BUTTON:
							X: PARENT_WIDTH / 2 - WIDTH / 2
							Y: 220
							Width: 140
							Height: 30
							Text: label-credits-title
							Font: Bold
