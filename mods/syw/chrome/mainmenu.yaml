						Button@BACK_BUTTON:
							X: PARENT_WIDTH / 2 - WIDTH / 2
							Key: escape
							Y: 260
							Width: 140
							Height: 30
							Text: button-back
							Font: Bold
		Container@PERFORMANCE_INFO:
			Logic: PerfDebugLogic
			Children:
				Label@PERF_TEXT:
					X: 30
					Y: WINDOW_HEIGHT - 70
					Width: 170
					Height: 40
					Contrast: true
				Background@GRAPH_BG:
					ClickThrough: true
					Background: dialog4
					X: WINDOW_WIDTH - 240
					Y: WINDOW_HEIGHT - 240
					Width: 210
					Height: 210
					Children:
						PerfGraph@GRAPH:
							X: 5
							Y: 5
							Width: 200
							Height: 200
		Container@UPDATE_NOTICE:
			X: (WINDOW_WIDTH - WIDTH) / 2
			Y: 95
			Width: 128
			Children:
				Label@A:
					Width: PARENT_WIDTH
					Height: 25
					Align: Center
					Shadow: true
					Text: label-update-notice-a
				Label@B:
					Y: 20
					Width: PARENT_WIDTH
					Height: 25
					Align: Center
					Shadow: true
					Text: label-update-notice-b
