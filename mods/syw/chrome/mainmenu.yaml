							X: 0
							Y: 20
							Width: 200
							Height: 30
							Text: label-map-editor-title
							Align: Center
							Font: Bold
						Button@NEW_MAP_BUTTON:
							X: PARENT_WIDTH / 2 - WIDTH / 2
