Container@PLAYER_WIDGETS:
	# SidebarLayoutLogic fits the lower half of the sidebar to the window height (the Y values below are the layout
	# for tall windows) and makes the palettes scroll when their rows do not fit.
	Logic: MenuButtonsChromeLogic, SelectionStatsLogic, BuildingTrainingLogic, TransportCargoLogic, SpellPaletteLogic, SidebarLayoutLogic
	Children:
		LogicTicker@SIDEBAR_TICKER:
		Background@SIDEBAR_BACKGROUND:
			X: WINDOW_WIDTH - 320
			Width: 320
			Height: WINDOW_HEIGHT
			Background: sidebar-panel
		MenuButton@OPTIONS_BUTTON:
			Key: escape
		# Unit commands, a row in the sidebar under the selection panel: Attack (attack-move: click a target or area;
		# hotkey A) and Stop (hotkey S). Shown only while own units are selected (UnitCommandsVisibilityLogic);
		# CommandBarLogic issues the orders. The panels below start 56 px lower to make room.
		Container@COMMAND_BAR:
			Logic: CommandBarLogic, UnitCommandsVisibilityLogic
				HighlightOnButtonPress: True
			X: WINDOW_WIDTH - 200
			Y: 592
			Width: 106
			Height: 52
			Children:
				WorldButton@ATTACK_MOVE:
					Width: 52
					Height: 52
					Key: AttackMove
					TooltipText: button-command-attack.tooltip
					TooltipDesc: button-command-attack.tooltipdesc
					TooltipContainer: TOOLTIP_CONTAINER
					TooltipTemplate: BUTTON_WITH_DESC_HIGHLIGHT_TOOLTIP
					Children:
						# CommandBarLogic needs a chrome Image named ICON; ours is a game sprite, so that one stays hidden.
						Image@ICON:
							ImageCollection: production-icons
							ImageName: infantry
							Visible: false
						Sprite@COMMAND_ICON:
							Logic: SequenceIconLogic
								Image: spell-icons
								Sequence: attack
							X: 2
							Y: 2
							Width: 48
							Height: 48
							Palette: knight
							Scale: 1.5
						ColorBlock@DISABLED:
							X: 2
							Y: 2
							Width: 48
							Height: 48
							Color: 00000090
				WorldButton@STOP:
					X: 54
					Width: 52
					Height: 52
					Key: Stop
					TooltipText: button-command-stop.tooltip
					TooltipDesc: button-command-stop.tooltipdesc
					TooltipContainer: TOOLTIP_CONTAINER
					TooltipTemplate: BUTTON_WITH_DESC_HIGHLIGHT_TOOLTIP
					Children:
						# CommandBarLogic needs a chrome Image named ICON; ours is a game sprite, so that one stays hidden.
						Image@ICON:
							ImageCollection: production-icons
							ImageName: infantry
							Visible: false
						Sprite@COMMAND_ICON:
							Logic: SequenceIconLogic
								Image: spell-icons
								Sequence: stop
							X: 2
							Y: 2
							Width: 48
							Height: 48
							Palette: knight
							Scale: 1.5
						ColorBlock@DISABLED:
							X: 2
							Y: 2
							Width: 48
							Height: 48
							Color: 00000090
		WorldLabelWithTooltip@CASH:
			Logic: IngameCashCounterLogic
