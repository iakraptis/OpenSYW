		# Grey frames and training icons share the build palette's 2-column grid (buttons at X 29/97,
		# 68 x 52 steps); each 64x48 icon sits 1 px inside its 66x50 frame.
		Container@PRODUCTION_BACKGROUND:
			X: WINDOW_WIDTH - 213
			Y: 686
			Children:
				Background@ICON_TEMPLATE:
					Width: 66
					Height: 50
					Background: dialog3
		ProductionPalette@PRODUCTION_PALETTE:
			IconSize: 64, 48
			IconMargin: 4, 4
			Columns: 2
			# Must be set with 2 columns: the engine default (int.MaxValue) times Columns overflows to a
			# negative icon count and the palette draws no buttons at all.
			MaxIconRowOffset: 10
			X: WINDOW_WIDTH - 212
			Y: 687
			Width: 132
			TooltipContainer: TOOLTIP_CONTAINER
			TooltipTemplate: PRODUCTION_TOOLTIP
			ReadyText: production-palette.ready
