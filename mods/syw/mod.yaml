Metadata:
	Title: mod-title
	Version: {DEV_VERSION}
	WindowTitle: mod-windowtitle

# The converted Seven Years War content (art, sounds, maps) lives in the player's support folder, written by the asset
# installer (OpenRA.Mods.Syw/AssetInstaller; SywContent.Version must match the v1 below). When it is missing the game
# opens the syw-content mod instead, which finds the original game and converts it.
FileSystem: ContentInstallerFileSystem
	SystemPackages:
		^EngineDir
		$syw: syw
		^EngineDir|mods/common: common
		~^SupportDir|Content/syw/v1/: content
	ContentPackages:
		content|audio
	RequiredContentFiles:
		# Written last by the installer: present only once a conversion has finished.
		content|install-manifest.txt
	ContentInstallerMod: syw-content

MapFolders:
	syw|maps: System
	# The converted original maps, through the content package (a ^SupportDir path here would be skipped by the
	# engine's map lint).
	~content|maps: System

Assemblies: OpenRA.Mods.Common.dll, OpenRA.Mods.Cnc.dll, OpenRA.Mods.Syw.dll

AssetBrowser:
	AudioExtensions: .wav
	SpriteExtensions: .png
	VideoExtensions:

SupportsMapsFrom: Syw

LoadScreen: BlankLoadScreen

ServerTraits:
	LobbyCommands
	SkirmishLogic
	PlayerPinger
	MasterServerPinger
	LobbySettingsNotification

MapGrid:
	TileSize: 32, 32
	Type: Rectangular

# ShpTS: OpenRA's own C&C bits (e.g. apctur.shp) used by the local GDI benchmark.
SpriteFormats: PngSheet, ShpTD, ShpTS

SoundFormats: Wav

TerrainFormat: DefaultTerrain

# Tileset-specific so dirt and snow maps can use their own crop art (sequences/common/resources.yaml TilesetFilenames).
SpriteSequenceFormat: TilesetSpecificSpriteSequence

DefaultOrderGenerator: UnitOrderGenerator

GameSpeeds:
	DefaultSpeed: default
	Speeds:
		slowest:
			Name: options-game-speed.slowest
			Timestep: 80
			OrderLatency: 2
		slower:
			Name: options-game-speed.slower
			Timestep: 50
			OrderLatency: 3
		default:
			Name: options-game-speed.normal
			Timestep: 40
			OrderLatency: 3
		fast:
			Name: options-game-speed.fast
			Timestep: 35
			OrderLatency: 4
		faster:
			Name: options-game-speed.faster
			Timestep: 30
			OrderLatency: 4
		fastest:
			Name: options-game-speed.fastest
			Timestep: 20
			OrderLatency: 6
		# Unattended AI test matches only (5x normal): selected by the bot-battle-test map.
		test:
			Name: options-game-speed-test
			Timestep: 8
			OrderLatency: 6

Include: mod.content.yaml
Include: mod.chrome.yaml
