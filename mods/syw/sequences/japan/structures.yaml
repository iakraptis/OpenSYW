# Japanese sprites: units, buildings and their portraits. Sheets come from --install-assets (AssetInstaller Units.cs,
# Buildings.cs and Effects.cs for the portraits); images are named after their actors (rules/japan).

jhq:
	underconstruction:
		Filename: art/buildings/jheadquarters/underconstruction.png
	idle:
		Filename: art/buildings/jheadquarters/idle.png
	damaged-idle:
		Filename: art/buildings/jheadquarters/damaged-idle.png

jbarracks:
	underconstruction:
		Filename: art/buildings/jbarracks/underconstruction.png
	idle:
		Filename: art/buildings/jbarracks/idle.png
	damaged-idle:
		Filename: art/buildings/jbarracks/damaged-idle.png
	# Flags on the three roofs (MOUSE 84-87, building_effects_export.py). The pole foot (frame pixel 29,30) sits on each
	# roof ridge: sprite pixels (40,15), (64,35) and (36,53). Staggered start frames so they don't wave in sync.
	flag1:
		Filename: art/effects/buildings/jflag.png
		Frames: 0, 1, 2, 3
		Length: 4
		Tick: 150
		Offset: -21, -47
		ZOffset: 1024
	flag2:
		Filename: art/effects/buildings/jflag.png
		Frames: 1, 2, 3, 0
		Length: 4
		Tick: 150
		Offset: 3, -27
		ZOffset: 1024
	flag3:
		Filename: art/effects/buildings/jflag.png
		Frames: 2, 3, 0, 1
		Length: 4
		Tick: 150
		Offset: -25, -9
		ZOffset: 1024

jmill:
	underconstruction:
		Filename: art/buildings/jmill/underconstruction.png
