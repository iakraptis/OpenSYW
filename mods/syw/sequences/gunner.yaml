		Length: 1
		Stride: 4
		Tick: 200
	idle:
		Filename: art/units/gunner/walk.png
		Facings: 8
		Length: 1
		Stride: 4
		Tick: 200
	shoot:
		Filename: art/units/gunner/shoot.png
		Facings: 8
		Length: 2
		Tick: 120
	die1:
		Filename: art/units/gunner/death.png
