# FOOTMAN.SPR shares ARCHER.SPR's layout: walk 0-19, attack 20-39 (S, SW, W, NW, N x 4), death 41-43 (frame 40
# unused). Sheets come from --install-assets (AssetInstaller/Units.cs): 8 facings in OpenRA order
# (N, NW, W, SW, S, SE, E, NE), the eastern ones mirrored.
footman:
	icon:
		Filename: art/icons/units/footman.png
	Defaults:
		Offset: [0, -10, 10]
		Scale: 0.85
	walk:
		Filename: art/units/footman/walk.png
		Facings: 8
		Length: 4
		Tick: 110
	stand:
		Filename: art/units/footman/walk.png
		Facings: 8
		Length: 1
		Stride: 4
		Tick: 200
	idle:
		Filename: art/units/footman/walk.png
		Facings: 8
		Length: 1
		Stride: 4
		Tick: 200
	attack:
		Filename: art/units/footman/shoot.png
		Facings: 8
		Length: 4
		Tick: 120
	die1:
		Filename: art/units/footman/death.png
		Length: 3
		Tick: 150
