# Same 8-facing-from-5-source-directions approach as peasant.yaml: N, NW, W,
# SW, S are real source frames; NE = mirrored NW, E = mirrored W,
# SE = mirrored SW. Facing order (index 0..7) is OpenRA's Facings: 8
# convention: N, NW, W, SW, S, SE, E, NE (see peasant.yaml for the derivation).
# Archer additionally has an "attack" animation (same 5-direction layout) and
# a single non-directional 3-frame death animation - both confirmed by the
# user from ARCHER.SPR: walk 0-19, attack 20-39, death 41-43 (frame 40 is an
# unidentified extra single frame, not used here).
archer:
	icon:
		Filename: art/icons/units/archer.png
	Defaults:
		Offset: [0, -10, 10]
		Scale: 0.85
	walk:
		Facings: 8
		Length: 4
		Tick: 110
		Combine:
			0:
