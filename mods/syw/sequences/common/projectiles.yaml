# Sprites both factions share.

# Arrow projectile, from FIRE.SPR frames 80-88 (user-identified): a 9-frame
# half-circle sweep S -> SSW -> SW -> WSW -> W -> WNW -> NW -> NNW -> N (180,
# stepping 22.5 each). The other 7 of a 16-point compass (the east side) are
# built by mirroring (FlipX) - S and N sit on the mirror axis and need no
# duplicate. Facing order/index below is OpenRA's Facings: 16 convention
# (same derivation as the units' Facings: 8, just twice the resolution):
# starts at North (index 0), increases counter-clockwise, step = 1024/16 = 64.
arrow:
	idle:
		Facings: 16
		Combine:
			0:
				Filename: art/effects/arrow/dir.png
				Start: 8
				Length: 1
			1:
				Filename: art/effects/arrow/dir.png
				Start: 7
				Length: 1
			2:
				Filename: art/effects/arrow/dir.png
				Start: 6
				Length: 1
			3:
				Filename: art/effects/arrow/dir.png
				Start: 5
				Length: 1
			4:
				Filename: art/effects/arrow/dir.png
				Start: 4
				Length: 1
			5:
				Filename: art/effects/arrow/dir.png
				Start: 3
				Length: 1
			6:
				Filename: art/effects/arrow/dir.png
				Start: 2
				Length: 1
			7:
				Filename: art/effects/arrow/dir.png
				Start: 1
				Length: 1
			8:
				Filename: art/effects/arrow/dir.png
				Start: 0
				Length: 1
			9:
				Filename: art/effects/arrow/dir.png
				Start: 1
				Length: 1
				FlipX: true
			10:
				Filename: art/effects/arrow/dir.png
				Start: 2
				Length: 1
				FlipX: true
			11:
				Filename: art/effects/arrow/dir.png
				Start: 3
				Length: 1
				FlipX: true
			12:
				Filename: art/effects/arrow/dir.png
				Start: 4
				Length: 1
				FlipX: true
			13:
				Filename: art/effects/arrow/dir.png
				Start: 5
				Length: 1
				FlipX: true
			14:
				Filename: art/effects/arrow/dir.png
				Start: 6
				Length: 1
				FlipX: true
			15:
				Filename: art/effects/arrow/dir.png
				Start: 7
				Length: 1
				FlipX: true

