# Sprites both factions share.

# UI-only images (not gameplay sprites). "clock" is the production-queue
# progress overlay ProductionPaletteWidget always requires (hardcoded
# default image name): a dimmed wedge for the time left, 48 frames drawn by
# SYWtoORA/tools/chrome_export.py. Frame 0 (fully dimmed) doubles as the
# "can't build" overlay.
clock:
	idle:
		Filename: chrome/assets/clock.png
		Length: *

mana-pips:
	full:
		Filename: chrome/assets/mana-full.png
	empty:
		Filename: chrome/assets/mana-empty.png

