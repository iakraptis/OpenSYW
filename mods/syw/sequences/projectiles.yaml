# Cannon-shell blast: original EXP.SPR 2x2-tile explosion, 15 frames (tools/explosion_export.py).
# EXP.SPR explosions (explosion_export.py, SYWtoORA/docs/formats/exp.md).
explosion:
	# C: dust burst - building destruction.
	building:
		Filename: art/effects/building-explosion.png
		Length: 13
		Tick: 80
		ZOffset: 511
	# B: flash and smoke - vehicle destruction.
	vehicle:
		Filename: art/effects/vehicle-explosion.png
		Length: 16
		Tick: 80
		ZOffset: 511
	# D1: medium dust burst - cannon shell impacts.
	cannon-impact:
		Filename: art/effects/cannon-impact.png
		Length: 13
		Tick: 60
		ZOffset: 511
	# D2: small dust burst - rocket impacts.
	rocket-impact:
		Filename: art/effects/rocket-impact.png
		Length: 13
		Tick: 60
		ZOffset: 511
	# A: fire blast - Bomber bombs and the Torpedo blast.
	cannon:
		Filename: art/effects/cannon-explosion.png
		Length: *
		Tick: 60
		ZOffset: 511
