# FARMER.SPR frames 0-47, the Bull layout: walk 0-19, loaded walk 20-39 (S, SW, W, NW, N x 4), harvest 40-43,
# death 44-47. Sheets come from --install-assets (AssetInstaller/Units.cs): 8 facings in OpenRA order
# (N, NW, W, SW, S, SE, E, NE), the eastern ones mirrored.
peasant:
	icon:
		Filename: art/icons/units/peasant.png
	Defaults:
		Offset: [0, -10, 10]
		Scale: 0.85
	walk:
		Filename: art/units/peasant/walk.png
		Facings: 8
		Length: 4
		Tick: 110
	stand:
		Filename: art/units/peasant/walk.png
		Facings: 8
		Length: 1
		Stride: 4
		Tick: 200
	idle:
		Filename: art/units/peasant/walk.png
		Facings: 8
		Length: 1
		Stride: 4
		Tick: 200
	die1:
		Filename: art/units/peasant/death.png
		Length: 4
		Tick: 150
	loaded-walk:
		Filename: art/units/peasant/loaded-walk.png
		Facings: 8
		Length: 4
		Tick: 110
	loaded-stand:
		Filename: art/units/peasant/loaded-walk.png
		Facings: 8
		Length: 1
		Stride: 4
		Tick: 200
	loaded-idle:
		Filename: art/units/peasant/loaded-walk.png
		Facings: 8
		Length: 1
		Stride: 4
		Tick: 200
	harvest:
		Filename: art/units/peasant/harvest.png
		Length: 4
		Tick: 200

# Chest dropped by a loaded Peasant on death (MOUSE 50).
resource-chest:
	idle:
		Filename: art/effects/chest.png
