# 8-facing sequences built from 5 real direction sheets (dir/*.png, each a
# 4-frame strip baked from the 20 individual movement frames) plus 3 mirrored
# (FlipX) facings for the directions we don't have source art for:
#   north/northwest/west/southwest/south are real source frames.
#   northeast = mirrored northwest, east = mirrored west, southeast = mirrored southwest.
# Facing order below (0..7) must match OpenRA's facing-index convention for
# Facings: 8, which starts at North (index 0) and proceeds counter-clockwise:
# N, NW, W, SW, S, SE, E, NE.
peasant:
	icon:
		Filename: art/icons/units/peasant.png
	Defaults:
		Offset: [0, -10, 10]
		Scale: 0.85		
	walk:
		Facings: 8
		Length: 4
		Tick: 110
		Combine:
			0:
				Filename: art/units/peasant/dir/north.png
				Start: 0
				Length: 4
			1:
				Filename: art/units/peasant/dir/northwest.png
				Start: 0
				Length: 4
			2:
				Filename: art/units/peasant/dir/west.png
				Start: 0
				Length: 4
			3:
				Filename: art/units/peasant/dir/southwest.png
				Start: 0
				Length: 4
			4:
				Filename: art/units/peasant/dir/south.png
				Start: 0
				Length: 4
			5:
				Filename: art/units/peasant/dir/southwest.png
				Start: 0
				Length: 4
				FlipX: true
			6:
				Filename: art/units/peasant/dir/west.png
				Start: 0
				Length: 4
				FlipX: true
			7:
				Filename: art/units/peasant/dir/northwest.png
				Start: 0
				Length: 4
				FlipX: true
	stand:
