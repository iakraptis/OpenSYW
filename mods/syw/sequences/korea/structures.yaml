# Korean sprites: units, buildings and their portraits. Sheets come from --install-assets (AssetInstaller Units.cs,
# Buildings.cs and Effects.cs for the portraits); images are named after their actors (rules/korea).

khq:
	underconstruction:
		Filename: art/buildings/headquarters/underconstruction.png
	idle:
		Filename: art/buildings/headquarters/idle.png
	damaged-idle:
		Filename: art/buildings/headquarters/damaged-idle.png

kbarracks:
	underconstruction:
		Filename: art/buildings/barracks/underconstruction.png
	idle:
		Filename: art/buildings/barracks/idle.png
	damaged-idle:
		Filename: art/buildings/barracks/damaged-idle.png
	# Tent flags (building_effects_export.py). The flag's pole bottom (frame pixel 30,11) sits on each
	# tent's pole tip: sprite pixels (68,0), (24,26) and (69,43). Staggered start frames so they don't wave in sync.
	flag1:
		Filename: art/effects/buildings/flag.png
		Frames: 0, 1, 2
		Length: 3
		Tick: 150
		Offset: 6, -44
		ZOffset: 1024
	flag2:
		Filename: art/effects/buildings/flag.png
		Frames: 1, 2, 0
		Length: 3
		Tick: 150
		Offset: -38, -18
		ZOffset: 1024
	flag3:
		Filename: art/effects/buildings/flag.png
		Frames: 2, 0, 1
		Length: 3
		Tick: 150
		Offset: 7, -1
		ZOffset: 1024

kmill:
	underconstruction:
		Filename: art/buildings/mill/underconstruction.png
	# Waterfall and wheel animation: 3 full-building frames from BUILD5 240-248/260-268/280-288
	# (building_construction_export.py). The damaged state stays static.
	idle:
		Filename: art/buildings/mill/idle.png
		Length: 3
		Tick: 150
	damaged-idle:
		Filename: art/buildings/mill/damaged-idle.png

