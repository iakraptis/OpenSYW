# Korean weapons, each inheriting a base from common.yaml.

# Footman.
KoreanSword:
	Inherits: ^Sword

# Archer.
KoreanBow:
	Inherits: ^Bow

# Gunner.
KoreanMusket:
	Inherits: ^Musket

# Commander: power 50, cooldown 18 -> 24, range 6.
KoreanCommanderBow:
	Inherits: ^Bow
	ReloadDelay: 24
	Range: 6c0
	Warhead@1Dam: SpreadDamage
		Damage: 5000

# Monk and Shaman.
KoreanFireball:
	Inherits: ^Fireball

# Monk.
KoreanHeal:
	Inherits: ^Heal

# Sky strike at the target using original RAIN frame 281.
# One-shots any infantry (toughest: Footman/Commander 26,775 HP), with headroom.
KoreanLightning:
	Report: thunder1.wav
	TargetActorCenter: true
	ReloadDelay: 50
	Range: 8c0
	ValidTargets: Ground, Air
	Projectile: InstantHit
		Blockable: false
	Warhead@SkyStrike: CreateEffect
		Image: shaman-lightning
		Explosions: strike
		ExplosionPalette: knight
		ValidTargets: Ground, Air
		ValidRelationships: Enemy
	Warhead@Damage: SpreadDamage
		Spread: 1
		Damage: 30000
		ValidTargets: Ground, Air
		ValidRelationships: Enemy
		Versus:
			None: 100
			Light: 100
			Heavy: 100
			Wood: 100
			Concrete: 100
		DamageTypes: DefaultDeath

# Provisional mine balance, separate from original game research.
KoreanMineExplosion:
	Warhead@Sound: CreateEffect
		ImpactSounds: exp1.wav
		ImpactActors: false
		ValidTargets: Ground
	Warhead@Damage: SpreadDamage
		Spread: 512
		Damage: 12000
		ValidTargets: Ground
		ValidRelationships: Enemy
		Versus:
			None: 75
			Light: 125
			Heavy: 150
			Wood: 50
			Concrete: 50
		DamageTypes: DefaultDeath

# Fire Car.
KoreanFireCarRockets:
	Inherits: ^Rockets

# Cannon.
KoreanCannonShot:
	Inherits: ^CannonShot

# Fighter.
KoreanFighterRockets:
	Inherits: ^FighterRockets

# Patrol Ship.
KoreanPatrolShipBow:
	Inherits: ^ShipBow

# Turtle Ship.
KoreanCannonShipShot:
	Inherits: ^CannonShipShot

# Arrow Tower.
KoreanTowerBow:
	Inherits: ^Bow
	Range: 7c0

# Cannon Tower.
KoreanCannonTowerShot:
	Inherits: ^CannonTowerShot
