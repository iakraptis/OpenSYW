		Spread: 512
		Damage: 12000
		ValidTargets: Ground
		ValidRelationships: Enemy
		Versus:
			None: 75
			Light: 125
			Heavy: 150
			Wood: 50
			Concrete: 50
		DamageTypes: DefaultDeath

