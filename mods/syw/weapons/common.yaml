# The shared explosion effects, and the bases (^Name) every faction weapon inherits from: korea.yaml and
# japan.yaml define the weapons the units use, so each faction can be balanced on its own.
# Balance: damage = original attack power x100 (same scale as HP = original HP x100);
# armor matchups use Versus tables; no flat unit defense reduction. ReloadDelay =
# original cooldown threshold x4/3 ticks (Archer 20 -> 27), after two user-requested 1.5x
# speed-ups; the Footman's animation-bound Sword gets the same factor (40 -> 18). See tools/ghidra/KoreanUnitStats.md.

# Visual-only destruction effect of every building and tower, both factions.
BuildingExplosion:
	Warhead@Effect: CreateEffect
		ImpactSounds: destroy1.wav
		Image: explosion
		Explosions: building
		ExplosionPalette: knight
		ImpactActors: false
		ValidTargets: Ground, Water

# Visual-only destruction effect for vehicles (EXP.SPR group B, flash and smoke).
VehicleExplosion:
	Warhead@Effect: CreateEffect
		ImpactSounds: exp1.wav
		Image: explosion
		Explosions: vehicle
		ExplosionPalette: knight
		ImpactActors: false
		ValidTargets: Ground, Water

# Ships go down with the sinking sound instead of the explosion.
ShipExplosion:
	Inherits: VehicleExplosion
	Warhead@Effect: CreateEffect
		ImpactSounds: sink.wav

^Bow:
	Report: arrow1.wav
	ReloadDelay: 27
	Range: 5c0
	ValidTargets: Ground, GroundActor, Air
	Projectile: Bullet
		Speed: 400
		Image: arrow
		Sequences: idle
		Palette: knight
		TrailPalette: knight
		Blockable: false
	Warhead@1Dam: SpreadDamage
		Spread: 100
		Damage: 3500
		ValidTargets: Ground, GroundActor, Air
		Versus:
			None: 100
			Light: 112
			Heavy: 50
			Wood: 57
		DamageTypes: DefaultDeath

# Gunner's weapon, also the base of every gun (Japanese Gunner, Armored Car, Japanese Arrow Tower).
# The bullet is FIRE 140-148 (2026-09-30, user-identified). Speed 500: the original bullet is 1.3x the arrow
# (35 vs 27 px per tick, docs/game/projectiles.md); faster made gunners hit walking units far more than the original.
^Musket:
	Report: gun1.wav, gun2.wav, gun3.wav
	ReloadDelay: 40
	Range: 5c0
	ValidTargets: Ground, GroundActor, Air
	Projectile: Bullet
		Speed: 500
		Image: musket-bullet
		Sequences: idle
		Palette: knight
		Blockable: false
	Warhead@1Dam: SpreadDamage
		Spread: 100
		Damage: 5000
		ValidTargets: Ground, GroundActor, Air
		Versus:
			None: 125
			Light: 100
			Heavy: 75
			Wood: 55
		DamageTypes: DefaultDeath

# Footman's melee weapon. InstantHit at melee range - the swing itself is
# shown by the attack animation, so no separate projectile sprite is needed.
^Sword:
	Report: sword1.wav, sword2.wav, sword3.wav
	ReloadDelay: 18
	Range: 1c256
	ValidTargets: Ground, GroundActor
	Projectile: InstantHit
		Blockable: false
	Warhead@1Dam: SpreadDamage
		Spread: 100
		Damage: 4500
		ValidTargets: Ground, GroundActor
		Versus:
			None: 90
			Light: 90
			Heavy: 125
			Wood: 112
		DamageTypes: DefaultDeath

# Single-sprite missile: FIRE.SPR frames 0-8.
# Power 50 split over a two-missile volley. Each missile explodes with area damage:
# full within 1 cell of impact, then 50% to 1.5 cells and 25% to 2 cells; own and allied units take 75% of it.
# Inherited by FighterRockets and CannonShot.
^Rockets:
	# Also the fighter's rockets (FighterRockets inherits this); CannonShot sets its own.
	Report: tank1.wav
	# Two shots 5 ticks apart; original cooldown 70.
	ReloadDelay: 93
	Burst: 2
	BurstDelays: 5
	Range: 7c0
	ValidTargets: Ground, Air
	# The original fire bolt is slower than an arrow (16 vs 27 px per tick, docs/game/projectiles.md).
	Projectile: Bullet
		Speed: 300
		Image: firecar-missile
		Sequences: idle
		Palette: knight
		TrailPalette: knight
		TrailImage: missile-trail
		TrailSequences: idle
		TrailInterval: 1
		TrailDelay: 1
		Blockable: false
	Warhead@Damage: SplashDamage
		Spread: 512
		Falloff: 100, 100, 50, 25, 0
		Damage: 2500
		ValidTargets: Ground, Air
		# Also own and allied actors in the blast, at 75% (SplashDamage AllyDamage).
		ValidRelationships: Enemy, Neutral, Ally
		Versus:
			None: 112
			Light: 100
			Heavy: 90
			Wood: 90
		DamageTypes: DefaultDeath
	# Rocket impact: EXP.SPR D2, the small dust burst.
	Warhead@Explosion: CreateEffect
		Image: explosion
		Explosions: rocket-impact
		ExplosionPalette: knight
		ValidTargets: Ground, Water, Air

# One stronger shot at longer range, ground-only at acquisition AND impact.
# Area damage and the projectile's look come from ^Rockets; the shell speed is its own.
^CannonShot:
	Inherits: ^Rockets
	Report: cannon1.wav, cannon2.wav, cannon3.wav
	ReloadDelay: 147
	Burst: 1
	Range: 10c0
	ValidTargets: Ground
	# The original cannonball is slower than an arrow (19 vs 27 px per tick, docs/game/projectiles.md).
	Projectile: Bullet
		Speed: 310
	Warhead@Damage: SplashDamage
		Damage: 8000
		ValidTargets: Ground
		Versus:
			None: 62
			Light: 100
			Heavy: 112
			Wood: 125
	# Cannon shell impact: EXP.SPR D1, the medium dust burst.
	Warhead@Explosion: CreateEffect
		Explosions: cannon-impact
		ValidTargets: Ground, Water

# Fighter: Fire Car rockets with power 50, cooldown 90 -> 120, range 6.
^FighterRockets:
	Inherits: ^Rockets
	ReloadDelay: 120
	Range: 6c0

# Patrol Ship: arrows with naval and air target support; power 50, cooldown 35.
^ShipBow:
	Inherits: ^Bow
	ReloadDelay: 47
	Range: 6c0
	ValidTargets: Ground, Water, Air
	Warhead@1Dam: SpreadDamage
		Damage: 5000
		ValidTargets: Ground, Water, Air

# Turtle Ship: power 75, cooldown 110.
^CannonShipShot:
	Inherits: ^CannonShot
	Range: 8c0
	ValidTargets: Ground, Water
	Warhead@Damage: SplashDamage
		Damage: 7500
		ValidTargets: Ground, Water

^CannonTowerShot:
	Inherits: ^CannonShot
	# Cannon range 10 cells x 1.10.
	Range: 11c0

# Monk fireball: initial stock damage approximation, not original spell mechanics.
^Fireball:
	Report: buda1.wav
	ReloadDelay: 33
	Range: 5c0
	ValidTargets: Ground, Air
	Projectile: Bullet
		Speed: 300
		Image: monk-fireball
		Sequences: idle
		Palette: knight
		TrailPalette: knight
		Blockable: false
	Warhead@Damage: SpreadDamage
		Spread: 100
		Damage: 6000
		ValidTargets: Ground, Air
		Versus:
			None: 100
			Light: 100
			Heavy: 100
			Wood: 100
		DamageTypes: DefaultDeath

# Stock medic-style healing, limited to one wounded allied infantry target.
^Heal:
	TargetActorCenter: true
	ReloadDelay: 80
	Range: 4c0
	ValidTargets: Heal
	Projectile: InstantHit
		Blockable: false
	Warhead@Heal: TargetDamage
		# Monk power 60 on the x100 scale; the original heal amount is not verified.
		Damage: -6000
		ValidTargets: Heal
		ValidRelationships: Ally
