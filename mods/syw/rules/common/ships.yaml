# Shared by both factions: the family bases (^syw-*) and one ^template per unit or building. A template holds what
# the Korean and Japanese versions have in common; each faction's actor (korea/, japan/) adds its own image,
# production queue, name and the values that differ.

# Shared naval movement/rendering; ship balance remains provisional.
^syw-ship:
	# Sees one cell less at night (DayNightCycle).
	NightVisionPenalty:
	Voiced:
		VoiceSet: MachineVoice
	# Attack-move (A key for players; the AI squads move with it), as on every C&C unit.
	AttackMove:
		Voice: Attack
	# The Stop button and hotkey say vstop.
	StopOrderVoice:
	# Repair button (stats panel): +500 HP every second until fully healed; a full repair costs
	# 50% of the unit's price, charged per step. Stops if the owner runs out of money.
	RepairableBuilding:
		RepairingNotification: Repairing
		RepairPercent: 50
		RepairInterval: 25
		RepairStep: 500
	AppearsOnRadar:
	UpdatesPlayerStatistics:
	GivesExperience:
	ScriptTriggers:
	BodyOrientation:
	QuantizeFacingsFromSequence:
		Sequence: idle
	Selectable:
		Priority: 10
		Bounds: 1792, 1792
	SelectionDecorations:
	Huntable:
	OwnerLostAction:
		Action: Kill
	HitShape:
	Armor:
		Type: Heavy
	RevealsShroud:
		Range: 7c0
	Mobile:
		Voice: Move
		Locomotor: naval
		Speed: 65
		TurnSpeed: 32
	Targetable:
		TargetTypes: Water, Ship
	HiddenUnderFog:
	MustBeDestroyed:
	# Destruction effect (EXP.SPR group B, flash and smoke); visual only.
	FireWarheadsOnDeath:
		Weapon: ShipExplosion
		EmptyWeapon: ShipExplosion
	# SHIP1.SPR index 2 is the projected shadow, like TANK: use the shadow-aware palette.
	RenderSprites:
		PlayerPalette: vehicle-player
	WithFacingSpriteBody:
	# Smokes below 50% health (FIRE 130-137).
	GrantConditionOnDamageState@SMOKE:
		Condition: damage-smoke
		ValidDamageStates: Heavy, Critical
	WithIdleOverlay@DAMAGESMOKE:
		Image: damage-smoke
		Sequence: loop
		Palette: knight
		RequiresCondition: damage-smoke
	Buildable:
		Queue: Naval.Korea
		Prerequisites: shipyard
		Icon: icon
		IconPalette: knight
	MapEditorData:
		Categories: Ships

^patrolship:
	Inherits: ^syw-ship
	Armor:
		Type: Light
	Health:
	Valued:
	Tooltip:
	Armament:
		LocalOffset: 0,0,512
		MuzzlePalette: knight
	AttackFrontal:
		FacingTolerance: 128
	AutoTarget:
		ScanRadius: 7
		InitialStance: AttackAnything
	AutoTargetPriority@COMBAT:
		ValidTargets: Ground, Water, Air
		ValidRelationships: Enemy
	AutoTargetPriority@UNITS:
		ValidTargets: Infantry, Vehicle, Ship, Air
		ValidRelationships: Enemy
		Priority: 2
	# Enemy units outrank buildings (Priority 2 over COMBAT's 1); PreferUnitTargets also drops a building it is
	# already hitting when a unit comes in range.
	PreferUnitTargets:

# Cannon ship is the Turtle Ship of the Korean roster.
^cannonship:
	Inherits: ^syw-ship
	RevealsShroud:
		Range: 10c0
	Mobile:
		Speed: 50
	Buildable:
		BuildPaletteOrder: 20
	Health:
		HP: 45900
	Valued:
	Tooltip:
		Name: actor-cannonship.name
	Armament:
		LocalOffset: 0,0,512
		MuzzlePalette: knight
	AttackFrontal:
		FacingTolerance: 128
	AutoTarget:
		ScanRadius: 10
		InitialStance: AttackAnything
	AutoTargetPriority@COMBAT:
		ValidTargets: Ground, Water
		ValidRelationships: Enemy
	AutoTargetPriority@UNITS:
		ValidTargets: Infantry, Vehicle, Ship
		ValidRelationships: Enemy
		Priority: 2
	# Enemy units outrank buildings (Priority 2 over COMBAT's 1); PreferUnitTargets also drops a building it is
	# already hitting when a unit comes in range.
	PreferUnitTargets:

^transportship:
	Inherits: ^syw-ship
	Buildable:
		BuildPaletteOrder: 30
	Health:
	Valued:
		Cost: 1000
	Tooltip:
	Cargo:
		UnloadVoice: Unload
		Types: Infantry, Vehicle
		MaxWeight: 8
		AfterUnloadDelay: 10
		UnloadTerrainTypes: Water
