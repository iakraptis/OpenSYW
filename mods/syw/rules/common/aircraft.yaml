# Shared by both factions: the family bases (^syw-*) and one ^template per unit or building. A template holds what
# the Korean and Japanese versions have in common; each faction's actor (korea/, japan/) adds its own image,
# production queue, name and the values that differ.

# Flying dragon: stock hovering aircraft behavior; movement is provisional.
^fighter:
	# Sees one cell less at night (DayNightCycle).
	NightVisionPenalty:
	Voiced:
		VoiceSet: MachineVoice
	# Attack-move (A key for players; the AI squads move with it), as on every C&C unit.
	AttackMove:
		Voice: Move
	# Repair button (stats panel): +500 HP every second until fully healed; a full repair costs
	# 50% of the unit's price, charged per step. Stops if the owner runs out of money.
	RepairableBuilding:
		RepairingNotification: Repairing
		RepairPercent: 50
		RepairInterval: 25
		RepairStep: 500
	AppearsOnRadar:
	UpdatesPlayerStatistics:
	CombatDebugOverlay:
	GivesExperience:
	ScriptTriggers:
	RenderDebugState:
	BodyOrientation:
	QuantizeFacingsFromSequence:
		Sequence: idle
	Selectable:
		Priority: 10
		Bounds: 1536, 1536
	SelectionDecorations:
	Huntable:
	OwnerLostAction:
		Action: Kill
	HitShape:
	Health:
	Armor:
		Type: Light
	RevealsShroud:
		Type: GroundPosition
		Range: 7c0
	Aircraft:
		Voice: Move
		CruiseAltitude: 1536
		Speed: 100
		TurnSpeed: 32
		CanHover: true
		CanSlide: true
		VTOL: true
		CanForceLand: false
	Targetable:
		TargetTypes: Air
	HiddenUnderFog:
		Type: GroundPosition
	MustBeDestroyed:
	# Destruction effect (EXP.SPR group B, flash and smoke); visual only.
	FireWarheadsOnDeath:
		Weapon: VehicleExplosion
		EmptyWeapon: VehicleExplosion
	RenderSprites:
		PlayerPalette: vehicle-player
	WithFacingSpriteBody:
	# Smokes below 50% health (FIRE 130-137).
	GrantConditionOnDamageState@SMOKE:
		Condition: damage-smoke
		ValidDamageStates: Heavy, Critical
	WithIdleOverlay@DAMAGESMOKE:
		Image: damage-smoke
		Sequence: loop
		Palette: knight
		RequiresCondition: damage-smoke
	Armament:
		Weapon: FighterRockets
		LocalOffset: 512,0,0
		MuzzlePalette: knight
	AttackAircraft:
		AttackType: Hover
		FacingTolerance: 64
	AutoTargetPriority@COMBAT:
		ValidTargets: Ground, Air
		ValidRelationships: Enemy
	AutoTarget:
		ScanRadius: 7
	Buildable:
		Prerequisites: planeworks
		BuildPaletteOrder: 10
		Icon: icon
		IconPalette: knight
	Valued:
		Cost: 2000
	Tooltip:
		Name: actor-fighter.name
	MapEditorData:
		Categories: Aircraft

# Unarmed air transport. Capacity is provisional until original behavior is recovered.
^transporter:
	Inherits: ^fighter
	-Armament:
	-AttackAircraft:
	-AutoTargetPriority@COMBAT:
	-AutoTarget:
	Health:
		HP: 38250
	Aircraft:
		Speed: 75
		CanForceLand: true
		LandableTerrainTypes: Clear, Crops
		AirborneCondition: airborne
	Targetable:
		RequiresCondition: airborne
	Buildable:
		BuildPaletteOrder: 20
	Tooltip:
		Name: actor-transporter.name
	Targetable@LANDED:
		TargetTypes: Ground, Vehicle
		RequiresCondition: !airborne
	Cargo:
		UnloadVoice: Unload
		Types: Infantry, Vehicle
		MaxWeight: 8
		AfterUnloadDelay: 10
		UnloadTerrainTypes: Clear, Crops
