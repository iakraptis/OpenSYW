# Shared by both factions: the family bases (^syw-*) and one ^template per unit or building. A template holds what
# the Korean and Japanese versions have in common; each faction's actor (korea/, japan/) adds its own image,
# production queue, name and the values that differ.

# Flattened from the stock cnc mod's E1 (engine/mods/cnc/rules/infantry.yaml)
# and its ^Soldier/^Infantry/^SpriteActor/^ExistsInWorld/^SelectableCombatUnit/
# ^PlayerHandicaps base chain (engine/mods/cnc/rules/defaults.yaml), trimmed of
# combat/weapon/veterancy/tiberium-specific traits we don't have assets for yet.
# Shared by all Korea infantry - see peasant/archer below.
^syw-infantry:
	# Sees one cell less at night (DayNightCycle).
	NightVisionPenalty:
	Voiced:
		VoiceSet: InfantryVoice
	# Death scream from the unit's voice set (Die).
	DeathSounds:
	# Attack-move (A key for players; the AI squads move with it), as on every C&C unit.
	AttackMove:
		Voice: Attack
	# The Stop button and hotkey say vstop.
	StopOrderVoice:
	# ^ExistsInWorld
	AppearsOnRadar:
	UpdatesPlayerStatistics:
	CombatDebugOverlay:
	GivesExperience:
		PlayerExperienceModifier: 1
	ScriptTriggers:
	RenderDebugState:

	# ^SpriteActor
	BodyOrientation:
	QuantizeFacingsFromSequence:
		Sequence: stand

	# ^PlayerHandicaps
	HandicapFirepowerMultiplier:
	HandicapDamageMultiplier:
	HandicapProductionTimeMultiplier:

	# ^Selectable (^SelectableCombatUnit minus the decorations that need a
	# chrome/terrain palette we haven't set up yet)
	Selectable:
		Priority: 10
		PriorityModifiers: Ctrl
		Bounds: 768, 768, 0, -256
		DecorationBounds: 512, 725, 0, -256
	SelectionDecorations:

	# ^Infantry
	Huntable:
	OwnerLostAction:
		Action: Kill
		DeathTypes: DefaultDeath
	HitShape:
	Armor:
		Type: None
	RevealsShroud:
		Range: 5c0
	Mobile:
		Voice: Move
		AlwaysTurnInPlace: true
		Locomotor: foot
		Speed: 55
	Targetable:
		TargetTypes: Ground, Infantry
	Targetable@HEAL:
		RequiresCondition: wounded
		TargetTypes: Heal
	GrantConditionOnDamageState@HEAL:
		Condition: wounded
		ValidDamageStates: Light, Medium, Heavy, Critical
	Passenger:
		Voice: Move
		CargoType: Infantry
		Weight: 1
	HiddenUnderFog:

	# ^Soldier
	MustBeDestroyed:

	MapEditorData:
		Categories: Infantry

# Chest dropped by a Peasant or Bull killed while carrying crops (MOUSE 50). Anyone's infantry or
# vehicles collect it by walking over it: 100 credits, paid instantly. It never expires.
resource-chest:
	Interactable:
	HiddenUnderFog:
	Tooltip:
		Name: actor-resource-chest.name
		ShowOwnerRow: false
	Crate:
		Duration: 0
		TerrainTypes: Clear, Crops
	GiveCashCrateAction:
		Amount: 100
		SelectionShares: 1
	RenderSprites:
		Image: resource-chest
		Palette: knight
	BodyOrientation:
		QuantizedFacings: 1
	WithSpriteBody:
	MapEditorData:
		Categories: System

^peasant:
	Inherits: ^syw-infantry
	Voiced:
		VoiceSet: WorkerVoice
	RenderSprites:
	Health:
		HP: 19125
	WithGathererInfantryBody:
		StandSequences: idle, stand
		MoveSequence: walk
		DefaultAttackSequence: idle
	WithDeathAnimation:
		DeathSequence: die1
		UseDeathTypeSuffix: false
		CrushedSequencePalette: player
		CrushedPaletteIsPlayerPalette: true
	Valued:
		Cost: 700
	Tooltip:
		Name: actor-peasant.name
	# A Peasant (or the Bull, which inherits this) killed while carrying crops drops a chest
	# worth 100 credits to whoever collects it.
	DropsChestWhenLoaded:
		Chest: resource-chest
	Harvester:
		HarvestVoice: Harvest
		Resources: Potato, Rice
		SearchOnCreation: false
		BaleLoadDelay: 20
		BaleUnloadDelay: 4
		HarvestFacings: 8
	StoresResources:
		Capacity: 5
		Resources: Potato, Rice
	# Hovering the HQ or Mill with nothing to unload showed the struck-out hand, although the order still works.
	DockClientManager:
		Voice: Harvest
		EnterBlockedCursor: enter
	Buildable:
		BuildPaletteOrder: 10
		Icon: icon
		IconPalette: knight
	Builder:

# Ox cart reuses gathering/docking, but cannot construct buildings.
^bull:
	Inherits: ^peasant
	-Targetable@HEAL:
	-GrantConditionOnDamageState@HEAL:
	-Builder:

	# ^Selectable (^SelectableCombatUnit minus the decorations that need a
	# chrome/terrain palette we haven't set up yet)
	Selectable:
		Bounds: 1536, 1536, 0, -256
		DecorationBounds: 1536, 1536, 0, -256
	Targetable:
		TargetTypes: Ground, Vehicle
	Passenger:
		CargoType: Vehicle
		Weight: 2

	MapEditorData:
		Categories: Vehicles
	Valued:
		Cost: 1400
	Tooltip:
		Name: actor-bull.name
	StoresResources:
		Capacity: 30
	Buildable:
		BuildPaletteOrder: 20
		Prerequisites: heavyarmsworkshop

^footman:
	Inherits: ^syw-infantry
	RenderSprites:
	Health:
	WithInfantryBody:
