^monk:
	Inherits: ^syw-infantry
	RenderSprites:
	Health:
		HP: 22950
	WithInfantryBody:
		StandSequences: idle, stand
		MoveSequence: walk
		DefaultAttackSequence: shoot
	WithDeathAnimation:
		DeathSequence: die1
		UseDeathTypeSuffix: false
		CrushedSequencePalette: player
		CrushedPaletteIsPlayerPalette: true
	Armament:
		Weapon: MonkFireball
		MuzzlePalette: knight
		FireDelay: 6
	AmmoPool@MANA:
		Name: mana
		Armaments: secondary
		Ammo: 100
		InitialAmmo: 100
		AmmoCondition: mana
	ReloadAmmoPool@MANA:
		AmmoPool: mana
		# 1 mana every 50 ticks (0.5 mana/second at normal speed).
		Delay: 10
		Count: 1
		ResetOnFire: false
	WithAmmoPipsDecoration@MANA:
		AmmoPools: mana
		PipCount: 10
		Image: mana-pips
		FullSequence: full
		EmptySequence: empty
		Palette: knight
		Position: BottomLeft
		Margin: 0, 4
		RequiresSelection: true
	Armament@HEAL:
		AmmoUsage: 30
		RequiresCondition: mana >= 30
		Name: secondary
		Weapon: MonkHeal
		FireDelay: 6
		MuzzlePalette: knight
		Cursor: heal
		OutsideRangeCursor: heal
		TargetRelationships: Ally
		ForceTargetRelationships: None
	# Mass Heal (FIRE 196 button): needs full mana and spends all of it. Heal amount provisional (one Heal each).
	MassHeal:
		Amount: 6000
		Range: 4c0
	# Disturb (FIRE 191): reveals invisible enemies (mines) within 5 cells for 5 seconds.
	Disturb:
		ManaCost: 40
		Duration: 125
		Range: 5c0
		Condition: disturbing
	DetectCloaked@DISTURB:
		RequiresCondition: disturbing
		Range: 5c0
		DetectionTypes: Mine, Cloak
	WithRangeCircle@DISTURB:
		RequiresCondition: disturbing
		Type: Disturb
		Range: 5c0
		Visible: Always
		Color: 80C0FF
	AutoTargetPriority@HEAL:
		RequiresCondition: mana >= 30
		ValidTargets: Heal
		ValidRelationships: Ally
		Priority: 3
	AutoTargetPriority@COMBAT:
		ValidTargets: Ground, Air
		ValidRelationships: Enemy
		Priority: 1
	AutoTargetPriority@UNITS:
		ValidTargets: Infantry, Vehicle, Air
		ValidRelationships: Enemy
		Priority: 2
	# Enemy units outrank buildings (Priority 2 over COMBAT's 1); PreferUnitTargets also drops a building it is
	# already hitting when a unit comes in range.
	PreferUnitTargets:
	AttackFrontal:
		FacingTolerance: 0
		# Silent: AttackVoiceByTarget says vheal for a heal, vattack for a fireball.
		Voice:
	AttackVoiceByTarget:
	AutoTarget:
		ScanRadius: 5
		InitialStance: AttackAnything
	Buildable:
		Prerequisites: temple
		BuildPaletteOrder: 20
		Icon: icon
		IconPalette: knight
	Valued:
		Cost: 900
	Tooltip:

