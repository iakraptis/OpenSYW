# Flattened from the stock cnc mod's ^Building/^SelectableBuilding base chain
# (engine/mods/cnc/rules/defaults.yaml), trimmed of traits that need audio,
# weapon, or economy assets we don't have yet (SoundOnDamageTransition,
# WithMakeAnimation, Sellable, ...).
# Shared by all 3x3 Korea buildings - see hq/barracks below.
^syw-building:
	# ^ExistsInWorld
	AppearsOnRadar:
	UpdatesPlayerStatistics:
	CombatDebugOverlay:
	GivesExperience:
		PlayerExperienceModifier: 1
	ScriptTriggers:
	RenderDebugState:
	# Repair button (stats panel): +1000 HP every second until fully healed; a full repair costs
	# 50% of the building's price, charged per step. Stops if the owner runs out of money.
	RepairableBuilding:
		RepairPercent: 50
		RepairInterval: 25
		RepairStep: 1000
	# Sell button (stats panel), like C&C: refunds 50% of the value, scaled by remaining health.
	# Unlike C&C, no infantry spawn from a sold building. The button sells directly, so no sell cursor.
	Sellable:
		RequiresCondition: !constructing
		RefundPercent: 50
		Cursor: default
	# Conquest victory: every building must be destroyed, like C&C.
	MustBeDestroyed:
		RequiredForShortGame: true

	# ^SpriteActor - buildings don't rotate, fixed single facing
	BodyOrientation:
		QuantizedFacings: 1

	# ^PlayerHandicaps
	HandicapFirepowerMultiplier:
	HandicapDamageMultiplier:
	HandicapProductionTimeMultiplier:

	# ^SelectableBuilding
	Selectable:
		Priority: 2
	SelectionDecorations:

	# ^Building
	CaptureManager:
	Capturable:
		Types: building
	Huntable:
	OwnerLostAction:
		Action: Kill
	Targetable:
		TargetTypes: Ground, C4, Structure
	Armor:
		Type: Wood
	HitShape:
		UseTargetableCellsOffsets: true
		Type: Rectangle
			TopLeft: -1536, -1536
			BottomRight: 1536, 1536
	Building:
		Dimensions: 3,3
		Footprint: xxx xxx xxx
		TerrainTypes: Clear
	WithSpriteBody:
		RequiresCondition: !constructing
	WithIdleOverlay@SCAFFOLD:
		Image: scaffold-medium
		Sequence: underconstruction
		RequiresCondition: constructing && !construction-structure
	WithIdleOverlay@CONSTRUCTION:
		Sequence: underconstruction
		RequiresCondition: constructing && construction-structure
	# All building types share the two construction stages. Map-placed
	# starting buildings have no UnderConstructionInit and start finished.
	UnderConstruction:
		Duration: 500
	FrozenUnderFog:
	FireWarheadsOnDeath:
		Weapon: KoreanBuildingExplosion
		EmptyWeapon: KoreanBuildingExplosion
	RevealsShroud:
		Range: 6c0
	MapEditorData:
		Categories: Building

hq:
	Inherits: ^syw-building
	RenderSprites:
		Image: hq
	Health:
		HP: 108000
	Valued:
		Cost: 2000
	Tooltip:
		Name: actor-hq.name
	Buildable:
		Queue: PeasantBuild
		BuildPaletteOrder: 5
		Icon: idle
		IconPalette: knight
	# Workers unloading here stay with their owner when the building is captured (stock DockHost would hand them over).
	KeepDockedWorkersOnCapture:
	Refinery:
		UseStorage: false
	DockHost:
		Type: Unload
		DockOffset: -1c0, 2c0, 0
		RequiresCondition: !constructing
	ProvidesPrerequisite:
		Prerequisite: hq
		RequiresCondition: !constructing
	# Bottom exit is preferred; the side/top exits are used when it is blocked
	# (e.g. by another building placed directly below).
	Exit@1:
		SpawnOffset: 0,0,0
		ExitCell: 1,3
		Priority: 2
	Exit@WEST:
		SpawnOffset: 0,0,0
		ExitCell: -1,1
	Exit@EAST:
		SpawnOffset: 0,0,0
		ExitCell: 3,1
	Exit@NORTH:
		SpawnOffset: 0,0,0
		ExitCell: 1,-1
	# Rally point: select the building and right-click the ground; trained units walk there.
	RallyPoint:
		Cursor: move
		CirclesSequence: flag
	Production:
		Produces: Workers.Korea
		RequiresCondition: !constructing
	ProductionQueue:
		Type: Workers.Korea
	ProductionBar:
		ProductionType: Workers.Korea

barracks:
	Inherits: ^syw-building
	RenderSprites:
		Image: barracks
	Health:
		HP: 81000
	Valued:
		Cost: 1000
	Tooltip:
		Name: actor-barracks.name
	Buildable:
		Queue: PeasantBuild
		BuildPaletteOrder: 10
		Icon: idle
		IconPalette: knight
	# UnderConstruction.Duration: 500 is inherited from ^syw-building - no override needed.
	# Without this, TechTree.Update() never runs (it's only triggered by an
	# actor with ProvidesPrerequisite or BuildLimit>0 being added to the
	# world), so the Archer's watcher registers but is never evaluated and
	# silently stays "not buildable" forever - no error, no crash, just an
	# empty/disabled palette icon.
	ProvidesPrerequisite:
		Prerequisite: barracks
		RequiresCondition: !constructing
	# Waving flags (MOUSE 80-82) on the three tent poles, once finished.
	WithIdleOverlay@FLAG1:
		Sequence: flag1
		Palette: knight
		RequiresCondition: !constructing
	WithIdleOverlay@FLAG2:
		Sequence: flag2
		Palette: knight
		RequiresCondition: !constructing
	WithIdleOverlay@FLAG3:
		Sequence: flag3
		Palette: knight
		RequiresCondition: !constructing
	# Bottom exit is preferred; the side/top exits are used when it is blocked
	# (e.g. by another building placed directly below).
	Exit@1:
		SpawnOffset: 0,0,0
		ExitCell: 1,3
		Priority: 2
	Exit@WEST:
		SpawnOffset: 0,0,0
		ExitCell: -1,1
	Exit@EAST:
		SpawnOffset: 0,0,0
		ExitCell: 3,1
	Exit@NORTH:
		SpawnOffset: 0,0,0
		ExitCell: 1,-1
	# Rally point: select the building and right-click the ground; trained units walk there.
	RallyPoint:
		Cursor: move
		CirclesSequence: flag
	Production:
		Produces: Infantry.Korea
		RequiresCondition: !constructing
	ProductionQueue:
		Type: Infantry.Korea
		Group: Infantry
	ProductionBar:
		ProductionType: Infantry.Korea

