# Compact towers share capture and construction behavior with other buildings.
^syw-tower:
	Inherits: ^syw-building
	Building:
		Dimensions: 2,2
		Footprint: xx xx
	HitShape:
		Type: Rectangle
			TopLeft: -1024, -1024
			BottomRight: 1024, 1024
	WithIdleOverlay@SCAFFOLD:
		Image: scaffold-small
	RevealsShroud:
		Range: 12c0
	Armament:
		LocalOffset: 0,0,1024
		MuzzlePalette: knight
		RequiresCondition: !constructing
	AttackOmni:
		RequiresCondition: !constructing
	AutoTarget:
		ScanRadius: 12
	AutoTargetPriority@COMBAT:
		ValidTargets: Ground
		ValidRelationships: Enemy

arrowtower:
	Inherits: ^syw-tower
	Armor:
