# The AI Generals, modelled on the C&C / Red Alert ModularBot setup. Stock modules handle units, harvesting,
# squads, repairs and captures; PeasantBaseBuilderBotModule replaces the construction-yard base builder
# because buildings are placed by Peasants. Each bot plays either faction: every list names both factions'
# types, and each faction's Peasant only builds its own buildings. Its faction (Korea, Japan or Random) is
# picked in the lobby like a human player's.
#
# Medium General: the original bot. Hard General: a stronger economy, staged towers at the Mills, larger attack
# waves, and it defends the whole base (Mills included) when attacked.
player:
	ModularBot@Medium:
		Name: bot-medium.name
		Type: medium
	ModularBot@Hard:
		Name: bot-hard.name
		Type: hard
	GrantConditionOnBotOwner@medium:
		Condition: enable-medium-ai
		Bots: medium
	GrantConditionOnBotOwner@hard:
		Condition: enable-hard-ai
		Bots: hard

	# ------------------------------------------------------------------ Medium General

	PeasantBaseBuilderBotModule@medium:
		RequiresCondition: enable-medium-ai
		BuilderTypes: kpeasant, jpeasant
		BaseCenterTypes: khq, jhq
		HarvesterTypes: kpeasant, kbull, jpeasant, jbull
		ResourceBuildingTypes: kmill, jmill
		# Towers go next to the Mills (the one with the fewest towers first).
		DefenseBuildingTypes: karrowtower, kcannontower, jarrowtower, jcannontower
		DefendedBuildingTypes: kmill, jmill
		MaxConcurrentConstructions: 2
		MaxBaseRadius: 24
		# Economy first: 4 workers before building, and $500 kept for unit production.
		MinimumHarvesters: 4
		CashReserve: 500
		# Relative weights: the building furthest below its share is built next (limits permitting).
		BuildingFractions:
			# 2026-09-29: higher shares for Barracks2 and the tech buildings, so bots reach them sooner.
			# Mills go next to the nearest crop field (ResourceBuildingTypes); first building.
			kmill: 40
			kbarracks: 20
			# Early: it unlocks the Heavy Arms Workshop and the rest of the tech tree.
			kbeaconmound: 25
			kheavyarmsworkshop: 15
			kbarracks2: 15
			kstable: 12
			ktemple: 12
			kshamanhouse: 10
			# 2026-09-29: raised again so bots build their air base.
			kplaneworks: 25
			karrowtower: 6
			kcannontower: 5
			# Japan: the same shares under the Japanese names.
			jmill: 40
			jbarracks: 20
			jbeacon: 25
			jheavyarms: 15
			jbarracks2: 15
			jstable: 12
			jtemple: 12
			jwitchhouse: 10
			jairport: 25
			jarrowtower: 6
			jcannontower: 5
		BuildingLimits:
			kmill: 2
			kbarracks: 2
			kbeaconmound: 1
			kheavyarmsworkshop: 2
			kbarracks2: 1
			kstable: 1
			ktemple: 1
			kshamanhouse: 1
			kplaneworks: 1
			karrowtower: 4
			kcannontower: 3
			jmill: 2
			jbarracks: 2
			jbeacon: 1
			jheavyarms: 2
			jbarracks2: 1
			jstable: 1
			jtemple: 1
			jwitchhouse: 1
			jairport: 1
			jarrowtower: 4
			jcannontower: 3
	UnitBuilderBotModule@medium:
		RequiresCondition: enable-medium-ai
		UnitQueues: Workers.Korea, Infantry.Korea, Vehicles.Korea, Aircraft.Korea, AdvancedInfantry.Korea, Temple.Korea, Shaman.Korea, Cavalry.Korea, Naval.Korea, Workers.Japan, Infantry.Japan, Vehicles.Japan, Aircraft.Japan, AdvancedInfantry.Japan, Temple.Japan, Shaman.Japan, Cavalry.Japan, Naval.Japan
		UnitsToBuild:
			# Workers first: a heavy weight until the limit below is reached.
			kpeasant: 300
			kbull: 8
			# Army targets as percentages (the engine compares them with each unit's share of all listed units):
			# about half infantry, a fifth vehicles, some cavalry and a few support units. Sums to 100.
			kfootman: 20
			karcher: 20
			kgunner: 15
			kfirecar: 10
			kcannon: 10
			kcommander: 10
			kfighter: 5
			kmonk: 4
			kshaman: 4
			koccupier: 2
			# Japan (only one faction's list applies to a player, so each sums to 100 on its own).
			jpeasant: 300
			jbull: 8
			jfootman: 20
			jarcher: 20
			jgunner: 15
			jarmoredcar: 10
			jcannon: 10
			jgeneral: 10
			jfighter: 3
			jbomber: 2
			jpriest: 4
			jwitch: 4
			jthief: 2
		UnitLimits:
			kpeasant: 10
			kbull: 2
			koccupier: 2
			kmonk: 4
			kshaman: 3
			jpeasant: 10
			jbull: 2
			jthief: 2
			jpriest: 4
			jwitch: 3
	HarvesterBotModule@medium:
		RequiresCondition: enable-medium-ai
		HarvesterTypes: kpeasant, kbull, jpeasant, jbull
		RefineryTypes: khq, kmill, jhq, jmill
	SquadManagerBotModule@medium:
		RequiresCondition: enable-medium-ai
		SquadSize: 10
		ExcludeFromSquadsTypes: kpeasant, kbull, koccupier, kminer, ktransporter, ktransportship, jpeasant, jbull, jthief, jtransporter, jsubmarine
		ConstructionYardTypes: khq, jhq
		AirUnitsTypes: kfighter, jfighter, jbomber
		NavalUnitsTypes: kpatrolship, kcannonship, jcannonship, jarrowship, jtorpedo
		NavalProductionTypes: kshipyard, jshipyard
		ProtectionTypes: khq, kbarracks, kmill, kbeaconmound, kheavyarmsworkshop, kbarracks2, kplaneworks, ktemple, kshamanhouse, kstable, karrowtower, kcannontower, kshipyard, kpeasant, kbull, jhq, jbarracks, jmill, jbeacon, jheavyarms, jbarracks2, jairport, jtemple, jwitchhouse, jstable, jarrowtower, jcannontower, jshipyard, jpeasant, jbull
	BuildingRepairBotModule@medium:
		RequiresCondition: enable-medium-ai
	CaptureManagerBotModule@medium:
		RequiresCondition: enable-medium-ai
		CapturingActorTypes: koccupier, jthief
		CapturableActorTypes: khq, kbarracks, kmill, kbeaconmound, kheavyarmsworkshop, kbarracks2, kplaneworks, ktemple, kshamanhouse, kstable, karrowtower, kcannontower, kshipyard, jhq, jbarracks, jmill, jbeacon, jheavyarms, jbarracks2, jairport, jtemple, jwitchhouse, jstable, jarrowtower, jcannontower, jshipyard

	# ------------------------------------------------------------------ Hard General

	PeasantBaseBuilderBotModule@hard:
		RequiresCondition: enable-hard-ai
		BuilderTypes: kpeasant, jpeasant
		BaseCenterTypes: khq, jhq
		HarvesterTypes: kpeasant, kbull, jpeasant, jbull
		ResourceBuildingTypes: kmill, jmill
		DefenseBuildingTypes: karrowtower, kcannontower, jarrowtower, jcannontower
		DefendedBuildingTypes: kmill, jmill
		# Tower stages (total towers once the building is finished): none before the Barracks, then one tower right
		# away, then up to six (about two per Mill) once the Heavy Arms Workshop or Barracks2 stands. Below the
		# allowed number, towers come before other buildings; each goes beside the least defended Mill.
		TowerSteps:
			kbarracks: 1
			jbarracks: 1
			kheavyarmsworkshop: 6
			kbarracks2: 6
			jheavyarms: 6
			jbarracks2: 6
		# Mills on the field's own side of any cliff: at most 6 steps' walk from the crop field, nearest first.
		MaxDropOffWalk: 6
		# Faster decisions and more building at once than Medium.
		DecisionInterval: 40
		MaxConcurrentConstructions: 3
		MaxBaseRadius: 26
		# A bigger workforce before the first building, and less cash held back.
		MinimumHarvesters: 6
		CashReserve: 300
		BuildingFractions:
			kmill: 40
			kbarracks: 20
			kbeaconmound: 25
			kheavyarmsworkshop: 15
			kbarracks2: 15
			kstable: 12
			ktemple: 12
			kshamanhouse: 10
			kplaneworks: 20
			# Towers guard the Mills (least defended Mill first): a much larger share than Medium.
			karrowtower: 18
			kcannontower: 14
			jmill: 40
			jbarracks: 20
			jbeacon: 25
			jheavyarms: 15
			jbarracks2: 15
			jstable: 12
			jtemple: 12
			jwitchhouse: 10
			jairport: 20
			jarrowtower: 18
			jcannontower: 14
		BuildingLimits:
			# A third Mill for a stronger economy, and two to three towers per Mill.
			kmill: 3
			kbarracks: 2
			kbeaconmound: 1
			kheavyarmsworkshop: 2
			kbarracks2: 1
			kstable: 1
			ktemple: 1
			kshamanhouse: 1
			kplaneworks: 1
			karrowtower: 8
			kcannontower: 6
			jmill: 3
			jbarracks: 2
			jbeacon: 1
			jheavyarms: 2
			jbarracks2: 1
			jstable: 1
			jtemple: 1
			jwitchhouse: 1
			jairport: 1
			jarrowtower: 8
			jcannontower: 6
	UnitBuilderBotModule@hard:
		RequiresCondition: enable-hard-ai
		UnitQueues: Workers.Korea, Infantry.Korea, Vehicles.Korea, Aircraft.Korea, AdvancedInfantry.Korea, Temple.Korea, Shaman.Korea, Cavalry.Korea, Naval.Korea, Workers.Japan, Infantry.Japan, Vehicles.Japan, Aircraft.Japan, AdvancedInfantry.Japan, Temple.Japan, Shaman.Japan, Cavalry.Japan, Naval.Japan
		UnitsToBuild:
			kpeasant: 300
			kbull: 10
			kfootman: 20
			karcher: 20
			kgunner: 15
			kfirecar: 10
			kcannon: 10
			kcommander: 10
			kfighter: 5
			kmonk: 4
			kshaman: 4
			koccupier: 2
			jpeasant: 300
			jbull: 10
			jfootman: 20
			jarcher: 20
			jgunner: 15
			jarmoredcar: 10
			jcannon: 10
			jgeneral: 10
			jfighter: 3
			jbomber: 2
			jpriest: 4
			jwitch: 4
			jthief: 2
		UnitLimits:
			# More workers to feed three Mills.
			kpeasant: 14
			kbull: 3
			koccupier: 2
			kmonk: 4
			kshaman: 3
			jpeasant: 14
			jbull: 3
			jthief: 2
			jpriest: 4
			jwitch: 3
	HarvesterBotModule@hard:
		RequiresCondition: enable-hard-ai
		HarvesterTypes: kpeasant, kbull, jpeasant, jbull
		RefineryTypes: khq, kmill, jhq, jmill
	SquadManagerBotModule@hard:
		RequiresCondition: enable-hard-ai
		# Larger attack waves keep a garrison at home for longer and hit harder when they go.
		SquadSize: 14
		SquadSizeRandomBonus: 6
		# Defence: when any protected actor is attacked, every combat unit within 35 cells of the HQ (the Mills at
		# the crop fields included; Medium only looks 15 cells out) forms the protection squad, which scans a wider
		# area around the attacker.
		ProtectUnitScanRadius: 35
		ProtectionScanRadius: 12
		MaxBaseRadius: 30
		ExcludeFromSquadsTypes: kpeasant, kbull, koccupier, kminer, ktransporter, ktransportship, jpeasant, jbull, jthief, jtransporter, jsubmarine
		ConstructionYardTypes: khq, jhq
		AirUnitsTypes: kfighter, jfighter, jbomber
		NavalUnitsTypes: kpatrolship, kcannonship, jcannonship, jarrowship, jtorpedo
		NavalProductionTypes: kshipyard, jshipyard
		ProtectionTypes: khq, kbarracks, kmill, kbeaconmound, kheavyarmsworkshop, kbarracks2, kplaneworks, ktemple, kshamanhouse, kstable, karrowtower, kcannontower, kshipyard, kpeasant, kbull, jhq, jbarracks, jmill, jbeacon, jheavyarms, jbarracks2, jairport, jtemple, jwitchhouse, jstable, jarrowtower, jcannontower, jshipyard, jpeasant, jbull
	BuildingRepairBotModule@hard:
		RequiresCondition: enable-hard-ai
	CaptureManagerBotModule@hard:
		RequiresCondition: enable-hard-ai
		CapturingActorTypes: koccupier, jthief
		CapturableActorTypes: khq, kbarracks, kmill, kbeaconmound, kheavyarmsworkshop, kbarracks2, kplaneworks, ktemple, kshamanhouse, kstable, karrowtower, kcannontower, kshipyard, jhq, jbarracks, jmill, jbeacon, jheavyarms, jbarracks2, jairport, jtemple, jwitchhouse, jstable, jarrowtower, jcannontower, jshipyard
