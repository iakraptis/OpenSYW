# Japanese actors (j prefix). Each inherits its ^template from common/ and adds only what is Japanese.

# ---------------------------------------------------------------- Buildings

jhq:
	Inherits: ^hq
	RenderSprites:
		Image: jhq
	Production:
		Produces: Workers.Japan
	ProductionQueue:
		Type: Workers.Japan
	ProductionBar:
		ProductionType: Workers.Japan

