		MoveSequence: walk
		DefaultAttackSequence: shoot
	WithDeathAnimation:
		DeathSequence: die1
		UseDeathTypeSuffix: false
		CrushedSequencePalette: player
		CrushedPaletteIsPlayerPalette: true
	ManualLightning:
	# Transform (FIRE 199 button): one allied Peasant becomes a random infantry unit.
	ShamanTransform:
		ManaCost: 70
		# Melee: adjacent cells, diagonals included.
		Range: 1c512
		Results: footman, archer, gunner, occupier, miner, monk, shaman, commander
	Armament:
		Weapon: MonkFireball
		RequiresCondition: !casting-lightning
		MuzzlePalette: knight
		FireDelay: 6
	Armament@LIGHTNING:
		Name: secondary
		Weapon: ShamanLightning
		AmmoUsage: 90
		PauseOnCondition: mana < 90 || !casting-lightning
		MuzzlePalette: knight
		FireDelay: 6
	AmmoPool@MANA:
		Name: mana
		Armaments: secondary
		Ammo: 100
		InitialAmmo: 100
		AmmoCondition: mana
	ReloadAmmoPool@MANA:
		AmmoPool: mana
		# Uniform 100-mana pools: 1 mana every 10 ticks (2.5/second), the same recharge
		# time per spell as the old 20-mana pool at 1 per 50 ticks.
		Delay: 10
		Count: 1
		ResetOnFire: false
	WithAmmoPipsDecoration@MANA:
		AmmoPools: mana
		PipCount: 10
		Image: mana-pips
		FullSequence: full
		EmptySequence: empty
		Palette: knight
		Position: BottomLeft
		Margin: 0, 4
		RequiresSelection: true
	AutoTargetPriority@COMBAT:
		ValidTargets: Ground
		ValidRelationships: Enemy
		Priority: 1
	AttackFrontal:
		Armaments: primary
		FacingTolerance: 0
	AttackFrontal@LIGHTNING:
		Armaments: secondary
		RequiresCondition: casting-lightning
		FacingTolerance: 0
	AutoTarget:
		ScanRadius: 5
	Buildable:
		Prerequisites: shamanhouse
		Queue: Shaman.Korea
		BuildPaletteOrder: 20
		Icon: icon
		IconPalette: knight
	Valued:
		Cost: 800
	Tooltip:
		Name: actor-shaman.name


