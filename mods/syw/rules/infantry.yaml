syw-mine:
	Armor:
		Type: None
	RenderSprites:
	BodyOrientation:
		QuantizedFacings: 1
	WithSpriteBody:
	HiddenUnderFog:
	Interactable:
	Mine:
		CrushClasses: mine
		DetonateClasses: mine
		AvoidFriendly: true
		BlockFriendly: false
	Health:
		HP: 1000
	Immobile:
		OccupiesSpace: true
	HitShape:
	Targetable:
		TargetTypes: Ground, Mine
	Cloak:
		# None keeps the friendly marker opaque; enemies still cannot see it.
		CloakStyle: None
		DetectionTypes: Mine
		InitialDelay: 0
		UncloakOn: None
	FireWarheadsOnDeath:
		Weapon: MinerMineExplosion
		EmptyWeapon: MinerMineExplosion
	Tooltip:
		Name: actor-syw-mine.name
	MapEditorData:
		Categories: System

# Mine while being laid (BUILD1 frame 200): cannot detonate, hidden from enemies like the
# armed mine. After the build time it replaces itself with the armed syw-mine (frame 201).
syw-mine-building:
	Inherits: syw-mine
	-Mine:
	-FireWarheadsOnDeath:
	KillsSelf:
		# Provisional build time: 100 ticks (4 seconds).
		Delay: 100
	SpawnActorOnDeath:
		Actor: syw-mine
		SkipMakeAnimations: true

# Chest dropped by a Peasant or Bull killed while carrying crops (MOUSE 50). Anyone's infantry or
# vehicles collect it by walking over it: 100 credits, paid instantly. It never expires.
resource-chest:
	Interactable:
	HiddenUnderFog:
	Tooltip:
		Name: actor-resource-chest.name
		ShowOwnerRow: false
	Crate:
		Duration: 0
		TerrainTypes: Clear, Crops
	GiveCashCrateAction:
		Amount: 100
		SelectionShares: 1
	RenderSprites:
		Image: resource-chest
		Palette: knight
	BodyOrientation:
		QuantizedFacings: 1
	WithSpriteBody:
	MapEditorData:
		Categories: System

