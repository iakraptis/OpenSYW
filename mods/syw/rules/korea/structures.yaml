# Korean actors (k prefix). Each inherits its ^template from common/ and adds only what is Korean.

khq:
	Inherits: ^hq
	RenderSprites:
		Image: hq
	Production:
		Produces: Workers.Korea
	ProductionQueue:
		Type: Workers.Korea
	ProductionBar:
		ProductionType: Workers.Korea

