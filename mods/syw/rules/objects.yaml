# Generated by --install-assets (AssetInstaller/MapObjects.cs) from the object table recovered from syw.exe;
# edit the table there. Map objects are neutral, cannot be selected or destroyed, and block movement on
# the cells the original blocks.
^syw-object:
	Interactable:
	HiddenUnderShroud:
	Tooltip:
		ShowOwnerRow: false
	BodyOrientation:
		QuantizedFacings: 1
	RenderSprites:
	WithSpriteBody:
	MapEditorData:
		Categories: Decoration

tree1:
	Inherits: ^syw-object
	Tooltip:
		Name: actor-tree.name
	Building:
		Footprint: xx
		Dimensions: 2,1
	WithIdleOverlay@SHADOW:
		Sequence: shadow

