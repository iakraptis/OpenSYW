Rules:
	player:
		# Scripted actors appear after the first victory check; conquest is tested in capture-victory-test.
		-ConquestVictoryConditions:
		# Fog off and map explored, so visibility checks only measure stealth.
		Shroud:
			FogCheckboxEnabled: False
			FogCheckboxLocked: True
			ExploredMapCheckboxEnabled: True
			ExploredMapCheckboxLocked: True
	world:
		-SpawnStartingUnits:
		LuaScript:
			Scripts: testlib.lua, test.lua
		# 5x speed: the whole suite runs in a few minutes.
		MapOptions:
			GameSpeed: test
			GameSpeedDropdownLocked: true
